[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supminer-hardware-checker"
version = "3.0.0"
description = "Auto-detect hardware and recommend mainstream mineable cryptocurrencies"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Davey Wong", email = "wgwcko@gmail.com"},
]
keywords = ["mining", "crypto", "hardware-detection", "gpu-mining", "asic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]

requires-python = ">=3.8"
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
rich = ["rich>=13.0.0"]

[project.urls]
Author = "https://www.guangweiblog.com"
Homepage = "https://github.com/weinotes/supminer-hardware-checker"
Repository = "https://github.com/weinotes/supminer-hardware-checker"
"SupMiner" = "https://supminer.net"
Issues = "https://github.com/weinotes/supminer-hardware-checker/issues"

[project.scripts]
supminer-check = "supminer_hardware_checker.detector:main"

[tool.setuptools.packages.find]
where = ["src"]
